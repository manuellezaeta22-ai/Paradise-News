<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clima | Paradise-News</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="clima.css">
</head>

<body>

    <header>

        <div class="encabezado">

            <img src="imagenes/logo.jpg"
                alt="Logo de ParadiseNews"
                class="logo">

            <div>
                <h1>ParadiseNews</h1>
                <p>Noticias claras y actuales del Departamento de Durazno</p>
            </div>

        </div>

    </header>


    <nav>

        <a href="index.html">Inicio</a>
        <a href="seguridad.html">Seguridad</a>
        <a href="clima.html" class="activo">Clima</a>
        <a href="empleos.html">Empleos</a>
        <a href="economia.html">Economía</a>
        <a href="politica.html">Política</a>

    </nav>


    <main class="clima-container">

        <div class="clima-header">
            <h2>Clima</h2>
            <p class="ubicacion">📍 Durazno, Uruguay</p>
        </div>


        <!-- CLIMA ACTUAL -->

        <section class="clima-actual">

            <div class="clima-principal">

                <div class="icono">
                    ☀️
                </div>

                <div>
                    <span class="temperatura">
                        --°
                    </span>

                    <p class="estado">
                        Cargando...
                    </p>
                </div>

            </div>


            <div class="clima-detalles">

                <div class="detalle">
                    <span>💧</span>
                    <p>Humedad</p>
                    <strong class="humedad">
                        --%
                    </strong>
                </div>


                <div class="detalle">
                    <span>💨</span>
                    <p>Viento</p>
                    <strong class="viento">
                        -- km/h
                    </strong>
                </div>


                <div class="detalle">
                    <span>🌡️</span>
                    <p>Sensación</p>
                    <strong class="sensacion">
                        --°
                    </strong>
                </div>

            </div>

        </section>


        <!-- PRONÓSTICO -->

        <section class="pronostico">

            <h2>Pronóstico</h2>

            <div class="dias"></div>

        </section>

    </main>


    <script src="clima.js"></script>

</body>

</html>
